name: Update Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"

permissions:
  contents: write

jobs:
  update-wiki:
    name: Sync docs/wiki to the GitHub wiki
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${repo}.wiki.git"

          # Try to clone, or initialize if it doesn't exist
          if git clone "$wiki_url" wiki-out 2>/dev/null; then
            echo "Wiki repository cloned successfully"
          else
            echo "Wiki repository doesn't exist yet. Creating it..."
            mkdir wiki-out
            cd wiki-out
            git init
            git branch -m main
            git remote add origin "$wiki_url"
            # Create an initial empty commit
            git commit --allow-empty -m "Initialize wiki"
            git push -u origin main
            cd ..
          fi

          # Copy files from docs/wiki
          cp -r docs/wiki/. wiki-out/
          
          cd wiki-out
          git add -A
          
          if git diff --cached --quiet; then
            echo "No changes to the wiki."
          else
            git commit -m "Sync wiki from ${GITHUB_SHA}"
            git push origin main
          fi